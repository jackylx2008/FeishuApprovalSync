[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "feishu-approval-sync"
version = "0.1.0"
description = "Personal Feishu approval synchronization tools"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28,<1",
    "python-dotenv>=1.2,<2",
    "PyYAML>=6,<7",
]

[tool.setuptools.packages.find]
where = ["src"]
